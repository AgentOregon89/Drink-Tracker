<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fridge Drink Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: #101827;
      --panel-2: #172033;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #263244;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top, #111827 0, var(--bg) 46rem); color: var(--text); }
    header { padding: 24px 18px 12px; max-width: 1120px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -0.06em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 1rem; }
    main { max-width: 1120px; margin: 0 auto; padding: 16px 18px 40px; }
    .toolbar { display: grid; gap: 12px; grid-template-columns: 1fr; margin: 18px 0; }
    @media (min-width: 760px) { .toolbar { grid-template-columns: 1fr auto auto; align-items: center; } }
    input, textarea { width: 100%; background: #0b1220; border: 1px solid var(--border); border-radius: 14px; color: var(--text); padding: 14px 15px; font: inherit; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.16); }
    button { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; cursor: pointer; color: var(--text); background: var(--panel-2); min-height: 46px; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { background: linear-gradient(135deg, #0284c7, #22c55e); }
    .take { background: linear-gradient(135deg, #dc2626, #f97316); font-size: 1rem; }
    .success { background: #15803d; }
    .ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .danger { background: #7f1d1d; }
    .status { color: var(--muted); min-height: 24px; margin: 12px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 16px; }
    .card { background: rgba(16,24,39,.92); border: 1px solid var(--border); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
    .photo { height: 180px; background: #0f172a; display: flex; align-items: center; justify-content: center; color: var(--muted); overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .content { padding: 15px; }
    .brand { color: var(--accent); font-size: .8rem; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
    .name { font-size: 1.25rem; font-weight: 900; margin: 4px 0 2px; }
    .flavor { color: var(--muted); margin-bottom: 10px; }
    .desc { color: #cbd5e1; min-height: 42px; }
    .count { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 0; padding: 12px; border-radius: 16px; background: #0b1220; border: 1px solid var(--border); }
    .count strong { font-size: 2.2rem; line-height: 1; }
    .low { color: var(--warning); font-weight: 900; }
    .out { color: var(--danger); font-weight: 900; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions .take { grid-column: 1 / -1; }
    dialog { width: min(680px, calc(100vw - 24px)); border: 1px solid var(--border); border-radius: 24px; background: #0b1220; color: var(--text); padding: 0; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(0,0,0,.7); }
    .modal { padding: 18px; }
    .modal h2 { margin: 0 0 14px; }
    .form-grid { display: grid; gap: 10px; }
    @media (min-width: 720px) { .form-grid { grid-template-columns: 1fr 1fr; } .span { grid-column: 1 / -1; } }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    .empty { color: var(--muted); padding: 24px; border: 1px dashed var(--border); border-radius: 18px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Fridge Drinks</h1>
    <p class="subtitle">Scan, choose a drink, tap Drink One. Counts are shared through Google Sheets.</p>
  </header>
  <main>
    <section class="toolbar">
      <input id="search" placeholder="Search name, brand, or flavor" />
      <button id="refresh" class="ghost">Refresh</button>
      <button id="addDrink" class="primary">Add Drink</button>
    </section>
    <div id="status" class="status">Loading drinks...</div>
    <section id="drinks" class="grid"></section>
  </main>

  <dialog id="drinkDialog">
    <form method="dialog" class="modal" id="drinkForm">
      <h2 id="dialogTitle">Add Drink</h2>
      <div class="form-grid">
        <input id="drinkId" type="hidden" />
        <label>Name<input id="name" required /></label>
        <label>Brand<input id="brand" required /></label>
        <label>Flavor<input id="flavor" /></label>
        <label>Quantity<input id="quantity" type="number" min="0" step="1" required /></label>
        <label>Low Stock Threshold<input id="threshold" type="number" min="0" step="1" value="3" /></label>
        <label class="span">Photo URL<input id="photo" placeholder="https://..." /></label>
        <label class="span">Description<textarea id="description" rows="3"></textarea></label>
      </div>
      <div class="modal-actions">
        <button type="button" id="deleteDrink" class="danger">Delete</button>
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    // Paste your deployed Google Apps Script Web App URL here.
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxoCN6L3EetzywXzSluzf7My9JlTgeS4m1547UTZQy5dmJjUAYPTw-atNrnlsvNeCkkpA/exec";

    const state = { drinks: [], query: "", editingId: null };
    const $ = (id) => document.getElementById(id);

    function setStatus(message) { $("status").textContent = message || ""; }
    function isConfigured() { return GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("PASTE_YOUR"); }
    function slugify(value) { return String(value || "drink").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

    async function api(action, payload = {}) {
      if (!isConfigured()) throw new Error("Add your Google Apps Script Web App URL to index.html first.");
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, ...payload })
      });
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || "Request failed.");
      return data;
    }

    async function loadDrinks() {
      try {
        setStatus("Loading drinks...");
        const data = await api("list");
        state.drinks = data.drinks || [];
        render();
        setStatus(`${state.drinks.length} drink${state.drinks.length === 1 ? "" : "s"} loaded.`);
      } catch (err) {
        setStatus(err.message);
        render();
      }
    }

    async function updateQuantity(id, delta) {
      const drink = state.drinks.find(d => d.id === id);
      if (!drink) return;
      const oldQuantity = Number(drink.quantity || 0);
      drink.quantity = Math.max(0, oldQuantity + delta);
      render();
      try {
        await api("changeQuantity", { id, delta });
        await loadDrinks();
      } catch (err) {
        drink.quantity = oldQuantity;
        render();
        setStatus(err.message);
      }
    }

    async function saveDrink(event) {
      event.preventDefault();
      const name = $("name").value.trim();
      const id = $("drinkId").value || slugify(`${$("brand").value}-${name}-${$("flavor").value}`);
      const drink = {
        id,
        name,
        brand: $("brand").value.trim(),
        flavor: $("flavor").value.trim(),
        quantity: Number($("quantity").value || 0),
        photoUrl: $("photo").value.trim(),
        description: $("description").value.trim(),
        lowStockThreshold: Number($("threshold").value || 0)
      };
      try {
        await api("upsert", { drink });
        $("drinkDialog").close();
        await loadDrinks();
      } catch (err) { setStatus(err.message); }
    }

    async function deleteDrink() {
      const id = $("drinkId").value;
      if (!id) return $("drinkDialog").close();
      if (!confirm("Delete this drink from the shared sheet?")) return;
      try {
        await api("delete", { id });
        $("drinkDialog").close();
        await loadDrinks();
      } catch (err) { setStatus(err.message); }
    }

    function openForm(drink = null) {
      state.editingId = drink?.id || null;
      $("dialogTitle").textContent = drink ? "Edit Drink" : "Add Drink";
      $("deleteDrink").style.display = drink ? "inline-block" : "none";
      $("drinkId").value = drink?.id || "";
      $("name").value = drink?.name || "";
      $("brand").value = drink?.brand || "";
      $("flavor").value = drink?.flavor || "";
      $("quantity").value = drink?.quantity ?? 0;
      $("threshold").value = drink?.lowStockThreshold ?? 3;
      $("photo").value = drink?.photoUrl || "";
      $("description").value = drink?.description || "";
      $("drinkDialog").showModal();
    }

    function render() {
      const query = state.query.toLowerCase();
      const drinks = state.drinks.filter(d => [d.name, d.brand, d.flavor].join(" ").toLowerCase().includes(query));
      if (!isConfigured()) {
        $("drinks").innerHTML = `<div class="empty">Paste your Google Apps Script Web App URL into index.html to connect the shared Google Sheet.</div>`;
        return;
      }
      if (!drinks.length) {
        $("drinks").innerHTML = `<div class="empty">No drinks found.</div>`;
        return;
      }
      $("drinks").innerHTML = drinks.map(d => {
        const quantity = Number(d.quantity || 0);
        const threshold = Number(d.lowStockThreshold || 0);
        const status = quantity === 0 ? `<span class="out">Out</span>` : quantity <= threshold ? `<span class="low">Low stock</span>` : `<span>In stock</span>`;
        const photo = d.photoUrl ? `<img src="${escapeHtml(d.photoUrl)}" alt="${escapeHtml(d.name)}" onerror="this.remove()">` : "No photo";
        return `<article class="card">
          <div class="photo">${photo}</div>
          <div class="content">
            <div class="brand">${escapeHtml(d.brand || "")}</div>
            <div class="name">${escapeHtml(d.name || "")}</div>
            <div class="flavor">${escapeHtml(d.flavor || "")}</div>
            <div class="desc">${escapeHtml(d.description || "")}</div>
            <div class="count"><span>${status}</span><strong>${quantity}</strong></div>
            <div class="actions">
              <button class="take" onclick="updateQuantity('${escapeAttr(d.id)}', -1)" ${quantity <= 0 ? "disabled" : ""}>Drink One</button>
              <button class="success" onclick="updateQuantity('${escapeAttr(d.id)}', 1)">+1</button>
              <button class="success" onclick="updateQuantity('${escapeAttr(d.id)}', 12)">+12</button>
              <button class="ghost" onclick='openForm(${JSON.stringify(d).replace(/'/g, "&#39;")})'>Edit</button>
            </div>
          </div>
        </article>`;
      }).join("");
    }

    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
    function escapeAttr(value) { return String(value ?? "").replace(/'/g, "\\'"); }

    $("search").addEventListener("input", e => { state.query = e.target.value; render(); });
    $("refresh").addEventListener("click", loadDrinks);
    $("addDrink").addEventListener("click", () => openForm());
    $("drinkForm").addEventListener("submit", saveDrink);
    $("cancel").addEventListener("click", () => $("drinkDialog").close());
    $("deleteDrink").addEventListener("click", deleteDrink);

    loadDrinks();
  </script>
</body>
</html>
